name: Deploy to WordPress

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for WordPress
        run: npm run build:wp

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.ingilteredil.com
          username: ingilteredil
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./dist-wp/
          server-dir: /public_html/wp-content/plugins/bilimevi-fiyat-teklifi/assets/
          dangerous-clean-slate: false
